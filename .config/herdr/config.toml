onboarding = false

# Keep a native cursor anchor visible for Japanese/CJK IME composition in
# terminal UIs that draw their own cursor (such as Codex).
[experimental]
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["codex"]
cjk_ime_cursor_shape = "steady_block"

[ui]
# The focused Codex session's model, effort, context size, and plan windows.
# `5h:—` means the account did not return a five-hour window, not zero use.
tab_bar_right = [
  { type = "command", command = "herdr-codex-status", interval_seconds = 5, timeout_seconds = 1 },
]
tab_bar_right_separator = "  "

[ui.sidebar.agents.rows_by_agent]
# Keep the agent identity while exposing Codex's current task title in the sidebar.
codex = [["state_icon", "terminal_title_stripped"], ["agent"]]
